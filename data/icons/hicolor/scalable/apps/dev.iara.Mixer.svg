<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="50%" stop-color="#182338" />
      <stop offset="100%" stop-color="#0b101b" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#48cae4" />
    </linearGradient>
    <linearGradient id="accent-teal" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06d6a0" />
      <stop offset="100%" stop-color="#72efdd" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#b5179e" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06d6a0" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#2a3b5c" stroke-width="2" />

  <!-- Ambient Wave Ribbon -->
  <path d="M 12 78 C 34 55, 62 95, 88 68 C 102 54, 112 60, 116 64 L 116 112 C 112 116, 20 116, 12 112 Z" fill="url(#wave)" />

  <!-- Channel 1 (Track + Fill + Thumb) -->
  <rect x="30" y="32" width="6" height="64" rx="3" fill="#1b253b" />
  <rect x="30" y="56" width="6" height="40" rx="3" fill="url(#accent-teal)" />
  <rect x="23" y="50" width="20" height="12" rx="4" fill="#ffffff" filter="url(#glow)" />
  <line x1="28" y1="56" x2="38" y2="56" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

  <!-- Channel 2 (Track + Fill + Thumb) -->
  <rect x="61" y="26" width="6" height="76" rx="3" fill="#1b253b" />
  <rect x="61" y="44" width="6" height="58" rx="3" fill="url(#accent-cyan)" />
  <rect x="54" y="38" width="20" height="12" rx="4" fill="#ffffff" filter="url(#glow)" />
  <line x1="59" y1="44" x2="69" y2="44" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

  <!-- Channel 3 (Track + Fill + Thumb) -->
  <rect x="92" y="32" width="6" height="64" rx="3" fill="#1b253b" />
  <rect x="92" y="68" width="6" height="28" rx="3" fill="url(#accent-purple)" />
  <rect x="85" y="62" width="20" height="12" rx="4" fill="#ffffff" filter="url(#glow)" />
  <line x1="90" y1="68" x2="100" y2="68" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

  <!-- Subtle Level Dot Indicators -->
  <circle cx="33" cy="24" r="2.5" fill="#06d6a0" />
  <circle cx="64" cy="18" r="2.5" fill="#00b4d8" />
  <circle cx="95" cy="24" r="2.5" fill="#b5179e" />
</svg>
